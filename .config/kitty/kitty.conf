
# -------------------------
# Window
# -------------------------

window_padding_width 6

background_opacity 1.0

# Blur (works on Hyprland/KDE/GNOME with compositor support)
background_blur 32

# Window decorations
hide_window_decorations yes

# Dynamic resize feel
resize_draw_strategy scale

# -------------------------
# Font
# -------------------------

font_family      JetBrains Mono bold
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

# Spacing tweaks
# modify_font cell_width 100%
# modify_font cell_height 100%

# Better cursor alignment
# adjust_line_height 2

# -------------------------
# Cursor
# -------------------------

cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

cursor_beam_thickness 1

# -------------------------
# Shell
# -------------------------

shell /bin/bash

# -------------------------
# Scrollback
# -------------------------

scrollback_lines 10000

wheel_scroll_multiplier 3.0

# -------------------------
# Mouse
# -------------------------

mouse_map right press ungrabbed paste_from_clipboard

# -------------------------
# Colors (One Dark)
# -------------------------

foreground #abb2bf
background #282c34

selection_foreground #282c34
selection_background #abb2bf

# Normal colors
color0  #282c34
color1  #e06c75
color2  #98c379
color3  #d19a66
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #abb2bf

# Bright colors
color8  #5c6370
color9  #e06c75
color10 #98c379
color11 #d19a66
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff

# -------------------------
# Performance / Smoothness
# -------------------------

enable_audio_bell no
visual_bell_duration 0.0

repaint_delay 8
input_delay 2

sync_to_monitor yes

# -------------------------
# Optional niceties
# -------------------------

confirm_os_window_close 0

tab_bar_edge top
tab_bar_style powerline

active_tab_foreground   #282c34
active_tab_background   #61afef

inactive_tab_foreground #abb2bf
inactive_tab_background #3b4048
